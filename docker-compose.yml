# TaxSathi AI — Production Docker Compose
# Usage: docker compose up --build -d

services:
  # ─── FastAPI Backend ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxsathi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-taxsathi}:${POSTGRES_PASSWORD:-taxsathi_db_secret_change_in_production}@postgres:5432/${POSTGRES_DB:-taxsathi_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - backend-uploads:/app/data/uploads
      - backend-chroma:/app/data/chromadb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxsathi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── PostgreSQL Database ─────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taxsathi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxsathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxsathi_db_secret_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-taxsathi_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - taxsathi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxsathi} -d ${POSTGRES_DB:-taxsathi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Distributed Rate Limiter ───
  redis:
    image: redis:7-alpine
    container_name: taxsathi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - taxsathi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── React Frontend SPA (Nginx) ──────────────
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: taxsathi-frontend
    restart: unless-stopped
    networks:
      - taxsathi-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Nginx Reverse Proxy / Gateway ───────────
  nginx:
    image: nginx:1.27-alpine
    container_name: taxsathi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - taxsathi-net

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  backend-chroma:

networks:
  taxsathi-net:
    driver: bridge
